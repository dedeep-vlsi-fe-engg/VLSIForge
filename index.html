  --title: #31475e; --title-ink: #eef3f7; --title-off: #3a434c;
  --rule: #23b468; --sel: #3b82c4; --sel-ink: #ffffff; --hover: #343c44; --btn: #2f363d; --btn2: #262c32;
  --ok: #4cc27a; --warn: #e3a33a; --err: #ff6b5e; --shadow: 0 12px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { background: var(--desk); color: var(--ink); font: 13px/1.4 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
#desk { position: absolute; inset: 0 0 34px 0; overflow: hidden;
  background-color: var(--desk);
  background-image: linear-gradient(var(--desk2) 1px, transparent 1px), linear-gradient(90deg, var(--desk2) 1px, transparent 1px);
  background-size: 48px 48px; }
#taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 6px;
  background: var(--panel); border-top: 1px solid var(--line); z-index: 99999; }
#taskbar .brand { font-weight: 700; letter-spacing: .01em; padding: 0 10px 0 4px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
#taskbar .brand i { width: 14px; height: 14px; display: inline-block; background: conic-gradient(from 45deg, var(--rule) 0 25%, #2fd06a 0 50%, #3a6df0 0 75%, #e8413b 0 100%); border-radius: 2px; }
#tasks { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
#tasks button { border: 1px solid var(--line); background: var(--btn); border-radius: 3px; padding: 3px 10px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-size: 12px; }
#tasks button.on { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
#taskbar .tb-right { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
.tbtn { border: 1px solid var(--line); background: var(--btn); border-radius: 3px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.tbtn:hover { background: var(--hover); }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

/* windows */
.win { position: absolute; display: flex; flex-direction: column; background: var(--win); border: 1px solid var(--line); border-radius: 6px 6px 3px 3px; box-shadow: var(--shadow); min-width: 260px; min-height: 120px; overflow: hidden; }
.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.win.min { display: none; }
.win .titlebar { height: 28px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; background: var(--title-off); color: var(--title-ink); cursor: default; user-select: none; touch-action: none; }
.win.active .titlebar { background: var(--title); }
.win .titlebar .tt { flex: 1; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win .titlebar .wb { width: 20px; height: 18px; border: 0; border-radius: 3px; background: rgba(255,255,255,.14); color: inherit; cursor: pointer; font-size: 11px; line-height: 18px; padding: 0; }
.win .titlebar .wb:hover { background: rgba(255,255,255,.3); }
.win .titlebar .wb.x:hover { background: #c8102e; }
.win .body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.win .grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 50%, var(--line) 50% 60%, transparent 60% 70%, var(--line) 70% 80%, transparent 80%); }
.menubar { display: flex; flex: none; gap: 0; padding: 0 4px; background: var(--win); border-bottom: 2px solid var(--rule); user-select: none; position: relative; z-index: 3; }
.menubar > .mi { padding: 4px 9px; cursor: default; border-radius: 3px 3px 0 0; }
.menubar > .mi:hover, .menubar > .mi.open { background: var(--hover); }
.menu { position: fixed; z-index: 100000; min-width: 210px; background: var(--win); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 3px 0; border-radius: 3px; }
.menu .it { display: flex; justify-content: space-between; gap: 24px; padding: 4px 14px 4px 22px; cursor: default; white-space: nowrap; position: relative; }
.menu .it:hover:not(.dis) { background: var(--sel); color: var(--sel-ink); }
.menu .it .k { color: var(--muted); font-size: 11.5px; }
.menu .it:hover .k { color: inherit; }
.menu .it.dis { color: var(--muted); opacity: .6; }
.menu .it.sub::after { content: '▸'; position: absolute; right: 6px; }
.menu .it.chk::before { content: '✓'; position: absolute; left: 7px; }
.menu .sep { height: 1px; background: var(--line2); margin: 3px 0; }
.toolbar { display: flex; flex: none; gap: 2px; align-items: center; padding: 3px 5px; background: var(--panel); border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.toolbar .ti { min-width: 28px; height: 26px; border: 1px solid transparent; border-radius: 3px; background: none; cursor: pointer; display: grid; place-items: center; padding: 0 5px; font-size: 12px; }
.toolbar .ti:hover { background: var(--hover); border-color: var(--line); }
.toolbar .ti.on { background: var(--sel); color: var(--sel-ink); }
.toolbar .ti svg { width: 18px; height: 18px; }
.toolbar .tsep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.toolbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-left: 6px; }
.toolbar input, .toolbar select { height: 22px; padding: 0 4px; border: 1px solid var(--line); background: var(--field); border-radius: 2px; font-size: 12px; }
.statusbar { flex: none; display: flex; gap: 0; font-size: 11.5px; background: var(--panel); border-top: 1px solid var(--line2); color: var(--muted); }
.statusbar > div { padding: 2px 8px; border-right: 1px solid var(--line2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar .grow { flex: 1; }
.mousebar { display: flex; font-size: 11.5px; background: var(--panel); border-top: 1px solid var(--line2); color: var(--muted); flex: none; }
.mousebar span { flex: 1; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv { flex: 1; min-height: 0; position: relative; background: #000; overflow: hidden; }
.cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.cv .hud { position: absolute; left: 8px; bottom: 6px; color: #9aa; font: 11px var(--mono); pointer-events: none; }

/* forms */
.form { padding: 10px 12px 4px; overflow: auto; flex: 1; }
.frow { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 10px; align-items: center; margin: 4px 0; }
.frow > .fl { color: var(--ink); white-space: nowrap; }
.frow.inline { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.fgroup { border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px 6px; margin: 10px 0 6px; position: relative; }
.fgroup > .gt { position: absolute; top: -9px; left: 8px; background: var(--win); padding: 0 4px; color: var(--rule); font-weight: 600; font-size: 12px; }
.form input[type=text], .form input:not([type]), .form input[type=number], .form select, .form textarea { width: 100%; padding: 3px 6px; border: 1px solid var(--line); background: var(--field); border-radius: 2px; min-width: 0; }
.form input[readonly] { background: var(--panel); color: var(--muted); }
.form textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
.form select[size] { padding: 0; }
.form label.opt { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.fbtns { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--line2); flex: none; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--btn); padding: 4px 14px; border-radius: 12px; cursor: pointer; min-width: 64px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--rule); color: #fff; border-color: var(--rule); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 2px 10px; min-width: 0; font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.fnote { color: var(--muted); font-size: 12px; margin: 6px 0; }

/* tables / lists */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-weight: 600; background: var(--panel); border: 1px solid var(--line2); padding: 3px 6px; position: sticky; top: 0; }
.tbl td { border: 1px solid var(--line2); padding: 2px 6px; background: var(--field); white-space: nowrap; }
.tbl tr.sel td { background: var(--sel); color: var(--sel-ink); }
.tbl tr:hover td { background: var(--hover); }
.tbl tr.sel:hover td { background: var(--sel); }
.lst { border: 1px solid var(--line); background: var(--field); overflow: auto; font-size: 12.5px; }
.lst .li { padding: 2px 8px; cursor: default; white-space: nowrap; user-select: none; }
.lst .li:hover { background: var(--hover); }
.lst .li.sel { background: var(--sel); color: var(--sel-ink); }
.lst .li .m { color: var(--muted); font-size: 11px; margin-left: 6px; }
.lst .li.sel .m { color: inherit; opacity: .8; }

/* CIW */
.ciw-log { flex: 1; overflow: auto; background: var(--field); font: 12px/1.45 var(--mono); padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
.ciw-log .e { color: var(--err); } .ciw-log .w { color: var(--warn); } .ciw-log .i { color: var(--muted); } .ciw-log .o { color: var(--ok); } .ciw-log .c { color: var(--sel); }
.ciw-in { display: flex; gap: 6px; padding: 5px 6px; background: var(--panel); border-top: 1px solid var(--line2); align-items: center; flex: none; }
.ciw-in input { flex: 1; font: 12.5px var(--mono); padding: 4px 6px; border: 1px solid var(--line); background: var(--field); border-radius: 2px; }
.ciw-in select { font-size: 12px; padding: 3px; border: 1px solid var(--line); background: var(--field); }
.code { flex: 1; min-height: 0; font: 12.5px/1.5 var(--mono); padding: 8px 10px; border: 0; outline: 0; resize: none; background: var(--field); color: var(--ink); tab-size: 4; white-space: pre; }
.pre { flex: 1; overflow: auto; background: var(--field); font: 12px/1.45 var(--mono); padding: 8px 10px; white-space: pre; margin: 0; }

/* ADE */
.ade { flex: 1; display: grid; grid-template-columns: 240px 1fr 38px; min-height: 0; gap: 0; }
.ade .pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line2); }
.ade .ph { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 3px 8px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line2); }
.ade .pb { flex: 1; overflow: auto; background: var(--field); }
.ade .right { display: grid; grid-template-rows: 1fr 1fr; min-height: 0; }
.ade .icons { display: flex; flex-direction: column; gap: 3px; padding: 4px 3px; background: var(--panel); align-items: center; }
.ade .icons button { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; display: grid; place-items: center; }
.ade .icons button:hover { background: var(--hover); border-color: var(--line); }
.ade .icons svg { width: 20px; height: 20px; }
.adeft { display: flex; gap: 14px; align-items: center; padding: 4px 8px; background: var(--panel); border-top: 1px solid var(--line2); font-size: 12px; flex-wrap: wrap; }
.adeft select { font-size: 12px; border: 1px solid var(--line); background: var(--field); }

/* wave */
.wave { flex: 1; display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
.wave .legend { background: #0b0b0b; color: #ddd; overflow: auto; font: 12px var(--mono); border-right: 1px solid #333; }
.wave .legend .sh { padding: 4px 8px; color: #aaa; background: #161616; border-bottom: 1px solid #2a2a2a; font-family: var(--sans); font-weight: 600; font-size: 11.5px; }
.wave .legend .tr { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: default; }
.wave .legend .tr:hover { background: #1d1d1d; }
.wave .legend .tr.off { opacity: .45; }
.wave .legend .sw { width: 14px; height: 10px; flex: none; border-radius: 1px; }
.wave .legend .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wave .legend .eye { cursor: pointer; color: #888; }
.tabs { display: flex; gap: 2px; padding: 3px 6px 0; background: var(--panel); border-bottom: 1px solid var(--line2); flex: none; overflow-x: auto; }
.tabs .tab { padding: 3px 10px; border: 1px solid var(--line2); border-bottom: 0; border-radius: 4px 4px 0 0; cursor: pointer; background: var(--btn2); font-size: 12px; white-space: nowrap; }
.tabs .tab.on { background: var(--win); font-weight: 600; box-shadow: inset 0 2px 0 var(--rule); }

/* LSW / layout */
.lay { flex: 1; display: grid; grid-template-columns: 168px 1fr; min-height: 0; }
.lsw { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line2); min-height: 0; }
.lsw .cur { padding: 6px; border-bottom: 1px solid var(--line2); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.lsw .ll { flex: 1; overflow: auto; }
.lsw .lr { display: grid; grid-template-columns: 30px 1fr 16px 16px; gap: 4px; align-items: center; padding: 2px 6px; cursor: pointer; font-size: 12px; }
.lsw .lr:hover { background: var(--hover); }
.lsw .lr.on { background: var(--sel); color: var(--sel-ink); }
.lsw .lr canvas { width: 30px; height: 14px; border: 1px solid #444; background: #000; }
.lsw .lr input { margin: 0; }
.lsw .lb { display: flex; gap: 3px; padding: 4px 6px; border-top: 1px solid var(--line2); flex-wrap: wrap; }
.lsw .lb button { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); background: var(--btn); border-radius: 2px; cursor: pointer; }

/* library manager */
.libm { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; min-height: 0; }
.libm .col { display: flex; flex-direction: column; min-height: 0; gap: 4px; }
.libm .col .ch { color: var(--rule); font-weight: 600; font-size: 12px; }
.libm .col input { padding: 3px 6px; border: 1px solid var(--line); background: var(--field); border-radius: 2px; }
.libm .col .lst { flex: 1; }

/* welcome */
.welcome { flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 0; }
.welcome .art { background: #000; position: relative; min-height: 220px; }
.welcome .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.welcome .art .cap { position: absolute; left: 14px; bottom: 12px; color: #9fb0b8; font: 11px var(--mono); }
.welcome .side { padding: 22px 24px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.welcome h1 { font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: -.01em; font-weight: 700; }
.welcome h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 8px; letter-spacing: 0; line-height: 1.45; max-width: 46ch; }
.welcome .acts { display: grid; gap: 6px; }
.welcome .act { text-align: left; border: 1px solid var(--line); background: var(--btn); border-radius: 4px; padding: 8px 12px; cursor: pointer; display: grid; gap: 1px; }
.welcome .act:hover { border-color: var(--sel); background: var(--hover); }
.welcome .act b { font-weight: 600; }
.welcome .act span { color: var(--muted); font-size: 12px; }
.welcome .techs { display: flex; gap: 6px; flex-wrap: wrap; }
.welcome .techs span { border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; font: 12px var(--mono); }
.welcome .fine { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.kbd { font: 11.5px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--btn); }
.toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); background: var(--title); color: var(--title-ink); padding: 7px 14px; border-radius: 4px; box-shadow: var(--shadow); z-index: 100001; font-size: 12.5px; max-width: 80vw; }
.ctxm { position: fixed; z-index: 100002; }
.dlg-msg { padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; flex: 1; overflow: auto; }
.dlg-msg .ic { font-size: 22px; line-height: 1; }
.dlg-msg .tx { white-space: pre-wrap; }
@media (max-width: 760px) {
  .welcome { grid-template-columns: 1fr; grid-template-rows: 180px 1fr; }
  .ade { grid-template-columns: 1fr 34px; } .ade > .pane:first-child { display: none; }
  .wave { grid-template-columns: 120px 1fr; } .lay { grid-template-columns: 120px 1fr; }
  .libm { grid-template-columns: 1fr; grid-auto-rows: minmax(120px, 1fr); overflow: auto; }
}

/* login (BitForge) */
#login { position: fixed; inset: 0; z-index: 200000; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr); background: var(--win); }
#login[hidden] { display: none; }
.lg-left { position: relative; background: #07090b; color: #e7ecef; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 5vw, 56px); }
.lg-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.lg-brand { position: relative; max-width: 30rem; }
.lg-parent { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .02em; color: #b8c4cc; font-size: 14px; }
.lg-parent img { width: 30px; height: auto; }
.lg-logo { width: min(340px, 80%); height: auto; display: block; filter: drop-shadow(0 6px 24px rgba(47, 208, 106, .18)); }
.lg-brand h1 { margin: 22px 0 18px !important; line-height: 0 !important; }
.lg-cardhead { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.lg-cardhead img { width: 54px; height: auto; flex: none; }
.lg-cardhead .lg-sub { margin: 0; }
#taskbar .brand img { width: 22px; height: auto; }
.lg-brand h1 { font-size: 0; }
.lg-brand p { color: #b8c4cc; font-size: 15px; line-height: 1.55; margin: 0 0 28px; max-width: 34ch; }
.lg-sibh { color: #7f8c95; font-size: 12px; margin-bottom: 6px; }
.lg-sib { display: inline-grid; gap: 1px; color: #e7ecef; text-decoration: none; border: 1px solid #2c343b; background: rgba(12,15,18,.75); border-radius: 6px; padding: 8px 14px; }
.lg-sib:hover { border-color: #3a6df0; }
.lg-sib span { color: #8d9aa3; font-size: 12px; }
.lg-foot { position: relative; color: #7f8c95; font-size: 12px; }
.lg-right { display: grid; place-items: center; padding: 24px; overflow: auto; }
.lg-card { width: min(380px, 100%); }
.lg-card h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.01em; }
.lg-sub { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
.lg-tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; padding: 3px; margin-bottom: 14px; }
.lg-tab { border: 0; background: none; padding: 7px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 500; }
.lg-tab.on { background: var(--title); color: var(--title-ink); }
.lg-f { display: grid; gap: 4px; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
.lg-f[hidden] { display: none; }
.lg-f input { padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--field); color: var(--ink); font-size: 14px; width: 100%; }
.lg-pw { display: flex; gap: 6px; }
.lg-eye { border: 1px solid var(--line); background: var(--btn); border-radius: 5px; padding: 0 10px; cursor: pointer; font-size: 12px; }
.lg-go { width: 100%; padding: 10px; border: 0; border-radius: 5px; background: var(--rule); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 4px; }
.lg-go:disabled { opacity: .6; cursor: progress; }
.lg-row { display: flex; justify-content: space-between; margin-top: 10px; }
.lg-link { border: 0; background: none; color: var(--sel); cursor: pointer; padding: 2px 0; font-size: 13px; text-align: left; }
.lg-link:hover { text-decoration: underline; }
.lg-msg { min-height: 0; font-size: 13px; margin: 2px 0 8px; line-height: 1.4; }
.lg-msg.err { color: var(--err); } .lg-msg.ok { color: var(--ok); }
.lg-fine { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 22px; border-top: 1px solid var(--line2); padding-top: 12px; }
.uchip { display: inline-flex; align-items: center; gap: 6px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uchip i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--title); color: var(--title-ink); display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }
#taskbar .brand small { font-weight: 400; color: var(--muted); }
@media (max-width: 760px) { #login { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .lg-left { min-height: 230px; } .lg-sibs, .lg-foot { display: none; } }

.welcome .art { background: #000; display: grid; place-items: center; overflow: hidden; }
.welcome .art .slide { position: absolute; inset: 14px 14px 40px; width: calc(100% - 28px); height: calc(100% - 54px); object-fit: contain; opacity: 0; transition: opacity .9s ease; image-rendering: auto; }
.welcome .art .slide.on { opacity: 1; }
.welcome .art .dots { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 6px; }
.welcome .art .dots button { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #5c6b70; background: transparent; padding: 0; cursor: pointer; }
.welcome .art .dots button.on { background: #23b468; border-color: #23b468; }
.welcome .fine a, .lg-foot a { color: inherit; }
a.lg-parent { text-decoration: none; }
a.lg-parent:hover span { text-decoration: underline; }
#wsgate { position: fixed; inset: 0; z-index: 200001; display: grid; place-items: center; background: color-mix(in srgb, var(--desk) 82%, transparent); backdrop-filter: blur(3px); padding: 16px; }
.ws-card { width: min(520px, 100%); background: var(--win); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 24px 26px; }
.ws-card h2 { margin: 0 0 4px; font-size: 20px; }
.ws-btns { display: grid; gap: 8px; margin: 18px 0 6px; }
.ws-alt { padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--btn); cursor: pointer; font-weight: 500; }
.ws-alt:hover { background: var(--hover); }
.wsst { font-size: 11.5px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsst[data-st="saved"] { color: var(--ok); } .wsst[data-st="pending"], .wsst[data-st="saving"] { color: var(--warn); } .wsst[data-st="error"] { color: var(--err); } .wsst[data-st="browser"] { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .welcome .art .slide { transition: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

// ===================== INVERTER LAYOUT BUILDER (examples / welcome art) =====================
function buildInverterLayout(tech, wn, wp, l) {
  const k = tech.scale, dn = techDevNames(tech), D = tech.devices;
  const n = mosPcell(tech, D[dn.n], { w: wn, l }), p = mosPcell(tech, D[dn.p], { w: wp, l });
  const nb = lbbox(n.shapes), pb = lbbox(p.shapes);
  const gap = 0.28 * k, py = nb.y2 + gap - pb.y1;
  const ng = n.terms.G[0], pg = p.terms.G[0], nd = n.terms.D[0], pd = p.terms.D[0], ns = n.terms.S[0], ps = p.terms.S[0];
  const r = (layer, x1, y1, x2, y2) => ({ id: uid(), layer, x1: +x1.toFixed(4), y1: +y1.toFixed(4), x2: +x2.toFixed(4), y2: +y2.toFixed(4) });
  const ymid = +((nb.y2 + py + pb.y1) / 2).toFixed(3);
  const viaX = -0.4 * k, xmax = Math.max(nb.x2, pb.x2), tapX = +(xmax + 0.04 * k).toFixed(3);
  const vssY1 = nb.y1 - 0.62 * k, vssY2 = nb.y1 - 0.32 * k, vddY1 = py + pb.y2 + 0.06 * k, vddY2 = vddY1 + 0.3 * k;
  const rails = [-0.8 * k, tapX + 0.4 * k];
  const cv = {
    insts: [{ id: uid(), name: 'NM0', lib: tech.name, cell: dn.n, params: { w: wn, l }, x: 0, y: 0 }, { id: uid(), name: 'PM0', lib: tech.name, cell: dn.p, params: { w: wp, l }, x: 0, y: py }],
    rects: [r('Poly', ng.x1, ng.y2, ng.x2, py + pg.y1), r('Poly', viaX + 0.12 * k, ymid - 0.05 * k, ng.x2, ymid + 0.05 * k),
      r('Metal1', nd.x1, nd.y2, nd.x2, py + pd.y1), r('Metal1', nd.x2, ymid - 0.06 * k, nd.x2 + 0.3 * k, ymid + 0.06 * k),
      r('Metal1', rails[0], vssY1, rails[1], vssY2), r('Metal1', ns.x1, vssY2, ns.x2, ns.y1),
      r('Metal1', rails[0], vddY1, rails[1], vddY2), r('Metal1', ps.x1, py + ps.y2, ps.x2, vddY1),
      r('prBoundary', rails[0] - 0.2 * k, vssY1 - 0.4 * k, rails[1] + 0.2 * k, vddY2 + 0.5 * k)],
    vias: [{ id: uid(), def: 'M1_PO', x: viaX, y: ymid }, { id: uid(), def: 'M1_PSUB', x: tapX, y: (vssY1 + vssY2) / 2 }, { id: uid(), def: 'M1_NWELL', x: tapX, y: (vddY1 + vddY2) / 2 }],
    paths: [], labels: [],
    pins: [{ id: uid(), name: 'in', dir: 'input', layer: 'Metal1', rect: { x1: viaX - 0.15 * k, y1: ymid - 0.15 * k, x2: viaX + 0.15 * k, y2: ymid + 0.15 * k } }, { id: uid(), name: 'out', dir: 'output', layer: 'Metal1', rect: { x1: nd.x2 + 0.3 * k, y1: ymid - 0.15 * k, x2: nd.x2 + 0.6 * k, y2: ymid + 0.15 * k } },
      { id: uid(), name: 'Vdd', dir: 'input', layer: 'Metal1', rect: { x1: rails[0], y1: vddY1, x2: rails[0] + 0.3 * k, y2: vddY2 } }, { id: uid(), name: 'Vss', dir: 'input', layer: 'Metal1', rect: { x1: rails[0], y1: vssY1, x2: rails[0] + 0.3 * k, y2: vssY2 } }],
  };
  return cv;
}

// Every library, cell view (schematic / symbol / layout / extracted / config), ADE setup, saved state,

const WS = {

// --- read a workspace folder ---
async function wsRead(dir) {
  const out = { libs: {}, scripts: {}, waves: null, meta: null };
  const readJSON = async (h) => JSON.parse(await (await h.getFile()).text());
  try { out.meta = await readJSON(await dir.getFileHandle('workspace.json')); } catch (_) { }
  try { out.scripts = await readJSON(await dir.getFileHandle('scripts.json')); } catch (_) { }
  try { out.waves = await readJSON(await dir.getFileHandle('waveforms.json')); } catch (_) { }
  let libDir = null; try { libDir = await dir.getDirectoryHandle('libraries'); } catch (_) { }
  if (libDir) for await (const [name, h] of libDir.entries()) {
    if (h.kind !== 'file' || !name.endsWith('.vlib.json')) continue;
    try { const d = await readJSON(h); if (d && d.lib && d.lib.name) out.libs[d.lib.name] = d.lib; } catch (e) { console.warn('Skipping damaged file', name, e); }

// ===================== EXAMPLES =====================
function loadExamples(open) {
  const L = 'CIC_Examples';
  if (DB.libs[L]) { if (open) { App.log('CIC_Examples already exists; opening the Library Manager.', 'i'); App.lastLib = L; new LibMgr(); } return; }
  DB.createLib(L, 'gpdk180', '~/Database/cadence_analog_labs/' + L);
  const I = (lib, cell, name, x, y, params, rot = 0) => ({ id: uid(), lib, cell, name, x, y, rot, params: params || {} });
  const W = (...pts) => ({ id: uid(), pts: pairs(pts) });
  const put = (cell, view, d) => { DB.libs[L].cells[cell] = DB.libs[L].cells[cell] || { views: {} }; DB.libs[L].cells[cell].views[view] = d; };
  const mosP = (w) => ({ m: '1', l: '180n', w, fingers: '1', gateConn: 'None', model: 'pmos1' });
  const mosN = (w) => ({ m: '1', l: '180n', w, fingers: '1', gateConn: 'None', model: 'nmos1' });
  // Inverter
  put('Inverter', 'schematic', { instances: [I('gpdk180', 'pmos', 'PM0', 0, -4, mosP('3u')), I('gpdk180', 'nmos', 'NM0', 0, 4, mosN('1u'))],
    wires: [W(0, -2, 0, 2), W(-2, -4, -4, -4, -4, 4, -2, 4), W(-7, 0, -4, 0), W(0, 0, 4, 0), W(0, -8, 0, -6), W(1, -4, 2, -4, 2, -7, 0, -7), W(0, 8, 0, 6), W(1, 4, 2, 4, 2, 7, 0, 7)],
    pins: [{ id: uid(), name: 'in', dir: 'input', x: -7, y: 0 }, { id: uid(), name: 'out', dir: 'output', x: 4, y: 0 }, { id: uid(), name: 'Vdd', dir: 'input', x: 0, y: -8 }, { id: uid(), name: 'Vss', dir: 'input', x: 0, y: 8 }], labels: [], notes: [] });
  put('Inverter', 'symbol', generateSymbol('Inverter', ['in'], ['out'], ['Vdd'], ['Vss'], 'inv'));
  // cs_amp
  put('cs_amp', 'schematic', { instances: [I('gpdk180', 'pmos', 'PM0', 0, -4, mosP('2u')), I('gpdk180', 'nmos', 'NM0', 0, 4, mosN('10u'))],
    wires: [W(0, -2, 0, 2), W(-6, -4, -2, -4), W(-6, 4, -2, 4), W(0, 0, 4, 0), W(0, -8, 0, -6), W(1, -4, 2, -4, 2, -7, 0, -7), W(0, 8, 0, 6), W(1, 4, 2, 4, 2, 7, 0, 7)],
    pins: [{ id: uid(), name: 'Vbias', dir: 'input', x: -6, y: -4 }, { id: uid(), name: 'Vin', dir: 'input', x: -6, y: 4 }, { id: uid(), name: 'Out', dir: 'output', x: 4, y: 0 }, { id: uid(), name: 'Vdd', dir: 'input', x: 0, y: -8 }, { id: uid(), name: 'Vss', dir: 'input', x: 0, y: 8 }], labels: [], notes: [] });
  put('cs_amp', 'symbol', generateSymbol('cs_amp', ['Vbias', 'Vin'], ['Out'], ['Vdd'], ['Vss'], 'tri'));
  SYM_CACHE.clear();
  // test benches built from symbol pin positions
  const bench = (dut, srcs) => {
    const sym = DB.libs[L].cells[dut].views.symbol; const pin = (n) => sym.pins.find(p => p.name === n);
    const cv = { instances: [I(L, dut, 'I0', 0, 0)], wires: [], pins: [], labels: [], notes: [] };
    let gi = 0; const gnd = (x, y) => cv.instances.push(I('analogLib', 'gnd', 'gnd' + (gi++), x, y));
    srcs(cv, pin, gnd);
    return cv;
  };
  put('Inverter_Test', 'schematic', bench('Inverter', (cv, pin, gnd) => {
    const pi = pin('in'), po = pin('out'), pd = pin('Vdd'), ps = pin('Vss');
    cv.instances.push(I('analogLib', 'vpulse', 'V0', pi.x - 4, pi.y + 2, { vdc: '', acm: '', v1: '0', v2: '1.8', per: '20n', pw: '10n', td: '', tr: '', tf: '' }));
    cv.wires.push(W(pi.x - 4, pi.y, pi.x, pi.y)); gnd(pi.x - 4, pi.y + 4); cv.labels.push({ id: uid(), text: 'Vin', x: pi.x - 2, y: pi.y });
    cv.instances.push(I('analogLib', 'vdc', 'V1', pd.x + 6, pd.y - 2, { vdc: '1.8', acm: '', acp: '' }));
    cv.wires.push(W(pd.x, pd.y, pd.x, pd.y - 4, pd.x + 6, pd.y - 4)); gnd(pd.x + 6, pd.y); gnd(ps.x, ps.y);
    cv.wires.push(W(po.x, po.y, po.x + 4, po.y)); cv.labels.push({ id: uid(), text: 'Vout', x: po.x + 4, y: po.y });
  }));
  put('cs_amp_test', 'schematic', bench('cs_amp', (cv, pin, gnd) => {
    const pb = pin('Vbias'), pi = pin('Vin'), po = pin('Out'), pd = pin('Vdd'), ps = pin('Vss');
    cv.instances.push(I('analogLib', 'vsin', 'V0', pi.x - 3, pi.y + 2, { vdc: '-1.8', acm: '1', acp: '', vo: '0', va: '5m', freq: '1K', td: '', phase: '' }));
    cv.wires.push(W(pi.x - 3, pi.y, pi.x, pi.y)); gnd(pi.x - 3, pi.y + 4); cv.labels.push({ id: uid(), text: 'Vin', x: pi.x - 1, y: pi.y });
    cv.instances.push(I('analogLib', 'vdc', 'V14', pb.x - 7, pb.y + 2, { vdc: '1', acm: '', acp: '' }));
    cv.wires.push(W(pb.x - 7, pb.y, pb.x, pb.y)); gnd(pb.x - 7, pb.y + 4);
    cv.instances.push(I('analogLib', 'vdc', 'V1', pd.x + 6, pd.y - 2, { vdc: '2.5', acm: '', acp: '' }));
    cv.wires.push(W(pd.x, pd.y, pd.x, pd.y - 4, pd.x + 6, pd.y - 4)); gnd(pd.x + 6, pd.y);
    cv.instances.push(I('analogLib', 'vdc', 'V13', ps.x, ps.y + 2, { vdc: '-2.5', acm: '', acp: '' })); gnd(ps.x, ps.y + 4);
    cv.wires.push(W(po.x, po.y, po.x + 4, po.y)); cv.labels.push({ id: uid(), text: 'Vout', x: po.x + 4, y: po.y });
  }));
  // layout (DRC / LVS clean)
  const lay = buildInverterLayout(TECHS.gpdk180, 1e-6, 3e-6, 180e-9); lay.source = { lib: L, cell: 'Inverter' };
  put('Inverter', 'layout', lay);
  // ADE states
  const model = [{ path: '/home/user/cadence/' + TECHS.gpdk180.modelFile, section: 'stat', enabled: true }];
  const st = (an, outs) => ({ simulator: 'spectre', models: model, analyses: Object.assign(defaultAnalyses(), an), vars: {}, outputs: outs.map(n => ({ name: '/' + n, kind: 'net', type: 'net', plot: true })), temp: 27, plotAfter: 'Auto', plotMode: 'Replace' });
  DB.libs[L].cells.Inverter_Test.states = { state_inverter: st({ tran: { enabled: true, touched: true, stop: '200n', errpreset: 'moderate' }, dc: Object.assign(defaultAnalyses().dc, { enabled: true, touched: true, saveOp: true, sweepType: 'comp', comp: '/V0', param: 'dc', start: '0', stop: '1.8' }) }, ['Vin', 'Vout']) };
  DB.libs[L].cells.Inverter_Test.states.state_inverter.outputs.push({ name: 'delay(?wf1 VT("/Vin") ?value1 0.9 ?edge1 "rising" ?wf2 VT("/Vout") ?value2 0.9 ?edge2 "falling")', label: 'tpHL', expr: 'delay(?wf1 VT("/Vin") ?value1 0.9 ?edge1 "rising" ?wf2 VT("/Vout") ?value2 0.9 ?edge2 "falling")', type: 'expr', plot: true });
  DB.libs[L].cells.cs_amp_test.states = { state_cs_amp: st({ tran: { enabled: true, touched: true, stop: '5m', errpreset: 'moderate' }, dc: Object.assign(defaultAnalyses().dc, { enabled: true, touched: true, saveOp: true, sweepType: 'comp', comp: '/V0', param: 'dc', start: '-5', stop: '5' }), ac: Object.assign(defaultAnalyses().ac, { enabled: true, touched: true }) }, ['Vin', 'Vout']) };
  DB.libs[L].cells.cs_amp_test.states.state_cs_amp.outputs.push({ name: 'gain', label: 'Gain (dB)', expr: 'value(dB20(VF("/Vout")) 1K)', type: 'expr', plot: false }, { name: 'bw', label: 'BW (Hz)', expr: 'bandwidth(VF("/Vout") 3 "low")', type: 'expr', plot: false });
  DB.persist(); App.lastLib = L; App.refreshLibMgr();
  App.log('Created library CIC_Examples (gpdk180): Inverter, Inverter_Test, cs_amp, cs_amp_test, a DRC/LVS-clean Inverter layout, and ADE states state_inverter / state_cs_amp.', 'o');
  if (open) { new LibMgr(); const ed = new SchEditor(L, 'Inverter_Test'); setTimeout(() => toast('Launch → ADE L, then Session → Load State → state_inverter, then run'), 400); }
}

// ===================== BOOT =====================
function setupKeys() {
  document.addEventListener('keydown', (e) => {
    const w = WM.active; if (!w || !w.o.onKey) return;
    const t = e.target; const inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    const isEditor = !!(w.editor || w.o.isEditor);
    if (inField && isEditor) return;
    if (inField && !isEditor && e.key !== 'Escape' && e.key !== 'Enter') return;
    if (inField && t.tagName === 'TEXTAREA' && e.key === 'Enter' && !(e.ctrlKey || e.metaKey)) return;
    try { if (w.o.onKey(e)) { e.preventDefault(); e.stopPropagation(); } } catch (err) { App.err(err); }
  });
}
function startApp() {
  DB.init();
  App._pend = '';
  App.skill = new SkillInterp((t) => { App._pend += String(t); let i; while ((i = App._pend.indexOf('\n')) >= 0) { App.log(App._pend.slice(0, i)); App._pend = App._pend.slice(i + 1); } clearTimeout(App._ft); App._ft = setTimeout(() => { if (App._pend) { App.log(App._pend); App._pend = ''; } }, 20); });
  const api = installBindings(App.skill);
  const pyRun = makePyRunner(api, (s) => App.skill.out(s));
  App.py = (code) => pyRun(code);
  setupKeys();
  App.ciw = new CIW();
  App.log((Auth.user ? 'Signed in as ' + Auth.user.email + '. ' : 'Local session (no account). ') + 'VLSIForge — a BitForge company. Technology libraries: ' + Object.keys(TECHS).join(', ') + '.', 'i');
  App.log('Type SKILL in the box below (or switch to Python). Help → Lab walkthrough for the CIC flow.', 'i');
  const libs = Object.keys(DB.libs);
  if (libs.length && !DB._fromFolder) App.log('Loaded ' + libs.length + ' librar' + (libs.length === 1 ? 'y' : 'ies') + ' from browser storage: ' + libs.join(', '), 'o');
  openWelcome();
}
